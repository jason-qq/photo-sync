<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No description/og: tags on purpose: messaging apps must not build
       link previews for review links. -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Photo review</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="review.css">
  <script src="common.js" defer></script>
  <script src="review.js" defer></script>
</head>
<body>
  <header class="bar">
    <span class="brand" id="brand">Photo review</span>
    <span class="save-status" role="status" aria-live="polite"></span>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="link" data-lang="en" lang="en">EN</button>
      <button type="button" class="link" data-lang="ja" lang="ja">日本語</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>

  <dialog id="viewer" aria-label="Photo preview">
    <div class="viewer-top">
      <span id="viewer-name"></span>
      <span id="viewer-pos" class="muted"></span>
      <button id="viewer-close" class="link" type="button" aria-label="Close">Close</button>
    </div>
    <div class="viewer-body">
      <button id="viewer-prev" class="nav" type="button" aria-label="Previous photo">‹</button>
      <img id="viewer-img" alt="">
      <button id="viewer-next" class="nav" type="button" aria-label="Next photo">›</button>
    </div>
    <!-- Filled by review.js for the photo on screen. -->
    <div id="viewer-feedback" class="viewer-feedback"></div>
  </dialog>
</body>
</html>
