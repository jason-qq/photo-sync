<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photo Sync</title>
  <link rel="stylesheet" href="app.css">
  <script src="common.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">Photo Sync</a>
    <button id="signout" class="link" type="button" hidden>Sign out</button>
  </header>
  <main id="app" aria-live="polite"></main>

  <dialog id="viewer" aria-label="Photo preview">
    <div class="viewer-top">
      <span id="viewer-name"></span>
      <span id="viewer-pos" class="muted"></span>
      <button id="viewer-close" class="link" type="button" aria-label="Close">Close ✕</button>
    </div>
    <div class="viewer-body">
      <button id="viewer-prev" class="nav" type="button" aria-label="Previous photo">‹</button>
      <div id="viewer-track" class="viewer-track"><img alt=""><img alt=""><img alt=""></div>
      <button id="viewer-next" class="nav" type="button" aria-label="Next photo">›</button>
    </div>
    <!-- Filled by app.js with each reviewer's feedback on the photo. -->
    <div id="viewer-feedback" class="viewer-feedback"></div>
  </dialog>
</body>
</html>
