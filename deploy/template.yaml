# AWS SAM template for photo-sync: one Lambda function serving the whole app
# (API + owner UI) behind an API Gateway HTTP API, with DynamoDB for data and
# a private S3 bucket for preview images.
#
# Deploy with deploy/deploy.ps1 (it builds the binary and creates the SSM
# secrets this template reads). SAM expands this file into plain
# CloudFormation; `sam deploy` shows the resulting change set before applying.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: photo-sync photo review app

Parameters:
  ParameterPrefix:
    Type: String
    Default: /photosync
    AllowedPattern: "^/[A-Za-z0-9_.-]+$"
    Description: >-
      SSM Parameter Store prefix of the two SecureString secrets created by
      deploy.ps1: <prefix>/api-key-hash and <prefix>/session-secret.
  PreviewRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days after upload when S3 deletes preview images.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Resources:
  # ---------------------------------------------------------------- data ---

  # Single table; layout documented in internal/store/dynamo.go. Must match
  # store.CreateTable (used for DynamoDB Local). LSI1 can only be created
  # together with the table.
  Table:
    Type: AWS::DynamoDB::Table
    # Keep data if the stack is deleted or the table would be replaced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: LSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      LocalSecondaryIndexes:
        - IndexName: LSI1
          KeySchema:
            - { AttributeName: PK, KeyType: HASH }
            - { AttributeName: LSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Private bucket: no public access at all; images are reached only via
  # presigned URLs the function issues. Name is generated by CloudFormation.
  PreviewBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePreviews
            Status: Enabled
            ExpirationInDays: !Ref PreviewRetentionDays
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  # Refuse any non-HTTPS access to the bucket.
  PreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PreviewBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PreviewBucket.Arn
              - !Sub "${PreviewBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ------------------------------------------------------------- compute ---

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Caps request rate account-wide for this API (cost and abuse guard).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      # Access log without the query string: upload URLs aren't involved here,
      # but keep the same rule as cmd/api (paths only).
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latencyMs":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  Function:
    Type: AWS::Serverless::Function
    Properties:
      Description: photo-sync API and owner UI
      # Built by deploy.ps1 (GOOS=linux GOARCH=arm64), not by `sam build`.
      CodeUri: ../build/lambda/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref FunctionLogs
      Environment:
        Variables:
          PHOTOSYNC_DYNAMODB_TABLE: !Ref Table
          PHOTOSYNC_S3_BUCKET: !Ref PreviewBucket
          PHOTOSYNC_API_KEY_HASH_PARAM: !Sub "${ParameterPrefix}/api-key-hash"
          PHOTOSYNC_SESSION_SECRET_PARAM: !Sub "${ParameterPrefix}/session-secret"
      Events:
        # No Path/Method: the $default route, i.e. every request.
        All:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
      # Least privilege: only what the code calls, only on these resources.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: Table
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt Table.Arn
                - !Sub "${Table.Arn}/index/*"
            # Presigned URLs carry the signer's permissions: the function
            # needs Put/Get so the URLs it issues work. HeadObject (Exists)
            # needs GetObject.
            - Sid: Previews
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${PreviewBucket.Arn}/*"
            # Without ListBucket, S3 answers HeadObject on a missing object
            # with 403 instead of 404, and /complete would fail with 500
            # instead of 409.
            - Sid: PreviewsList
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt PreviewBucket.Arn
            # SecureStrings use the AWS-managed aws/ssm KMS key, which
            # doesn't need a separate kms:Decrypt grant.
            - Sid: Secrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/api-key-hash"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/session-secret"

Outputs:
  ApiUrl:
    Description: App URL (owner UI; set PHOTOSYNC_API_URL to this for the uploader)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref PreviewBucket
